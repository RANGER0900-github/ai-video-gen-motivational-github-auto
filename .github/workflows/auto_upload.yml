name: Scheduled YouTube Shorts Auto Upload

on:
  schedule:
    # Runs 6 times a day: every 2 hours between 08:00 and 18:00 UTC (08:00, 10:00, 12:00, 14:00, 16:00, 18:00)
    # YouTube free Data API limit = 10,000 units/day; 1 upload = 1,600 units -> max 6 uploads/day
    - cron: '0 8,10,12,14,16,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-auto-upload
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install Node dependencies
        run: |
          npm ci || npm install

      - name: Generate motivational video
        env:
          PYTHONPATH: backend
        run: |
          python -m app.cli --count 1

      - name: Upload to YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          node upload.js

      - name: Commit and push updated quote and image usage
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add quotes.csv images_usage.json
          if git diff --staged --quiet; then
            echo "No quote or image changes to commit."
          else
            git commit -m "chore: record quote and image usage [skip ci]"
            git push origin main
          fi

