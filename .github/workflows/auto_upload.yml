name: Scheduled YouTube Shorts Auto Upload

on:
  schedule:
    # Runs 6 times a day: every 4 hours around the clock (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # YouTube free Data API limit = 10,000 units/day; 1 upload = 1,600 units -> max 6 uploads/day
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-auto-upload
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install Node dependencies
        run: |
          npm ci || npm install

      - name: Pre-flight syntax and integrity checks
        env:
          PYTHONPATH: backend
        run: |
          echo "Checking Node.js scripts syntax..."
          node -c upload.js
          node -c scripts/get_youtube_token.js
          echo "Checking Python scripts syntax..."
          python -m py_compile $(find backend/app -name "*.py")
          echo "Running pipeline tests..."
          pip install pytest
          pytest tests/
          echo "Pre-flight checks passed!"

      - name: Generate motivational video
        env:
          PYTHONPATH: backend
        run: |
          python -m app.cli --count 1

      - name: Upload to YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          node upload.js

      - name: Commit and push updated quote and media usage
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.csv images_usage.json media_usage.json
          if git diff --staged --quiet; then
            echo "No quote or media changes to commit."
          else
            git commit -m "chore: record quote and media usage [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

